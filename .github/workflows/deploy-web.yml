name: Deploy web-client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run

      - name: Build (GitHub Pages base path)
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Public by design (ship in the JS bundle); RLS is the security boundary.
          VITE_SUPABASE_URL: https://prjsiywvhxqnsvsmfgxm.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_CI-gegnlyhVoOfHr-1SEmw__J_BDZZ6
          # Empty = no battle engine; the Battle tab/route is hidden. To enable battles set
          # the Tailscale Funnel URL, e.g. 'https://<machine>.<tailnet>.ts.net' (battle-engine/README.md section 6).
          VITE_BATTLE_ENGINE_URL: ''
        run: npm run build

      # GitHub Pages serves 404.html for unknown deep links; reusing the SPA
      # shell lets React Router resolve client-side routes on hard reloads.
      - name: SPA deep-link fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
