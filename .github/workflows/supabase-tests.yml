name: Supabase schema tests

# Applies every migration + seed to PGlite (Postgres in WASM, with a Supabase
# roles/auth shim) and checks RLS, function privileges and the game RPCs.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase-tests.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci
      - run: npm test
