name: Supabase schema tests

# Applies every migration + seed to PGlite (Postgres in WASM, with a Supabase
# roles/auth shim) and checks RLS, function privileges and the game RPCs.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase-tests.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci
      - run: npm test

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env supabase/functions/_shared/qr.test.ts
      - run: deno check supabase/functions/claim/index.ts supabase/functions/qr-catalog/index.ts supabase/functions/admin-spawn/index.ts
