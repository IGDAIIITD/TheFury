server.port=17172
spring.application.name=campusforge-backend

# PostgreSQL Database Configuration (local Postgres 18 on default port 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/campusforge
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# JWT Configuration (override via env: JWT_SECRET, JWT_EXPIRATION_MS)
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f5c8b9a2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# QR claim token signing (override via env: QR_SIGNING_SECRET)
campusforge.qr.signing-secret=${QR_SIGNING_SECRET:7c1e9d4a2f6b8c3d5e7a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e}

# Feature switches
campusforge.features.ai-battles.enabled=false
