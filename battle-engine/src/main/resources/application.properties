server.port=17175
spring.application.name=campusforge-battle-engine

# Supabase connectivity (override via env: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY)
supabase.url=${SUPABASE_URL:http://127.0.0.1:54321}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# Access tokens are verified against the project JWKS. SUPABASE_JWT_SECRET is only
# needed for projects still on the legacy HS256 secret (or the local CLI stack);
# leave it unset otherwise so no shared-secret tokens are accepted.
supabase.jwt-secret=${SUPABASE_JWT_SECRET:}

# CORS origins allowed to call the engine (comma-separated; override via CAMPUSFORGE_CORS_ALLOWED_ORIGINS)
campusforge.cors.allowed-origins=${CAMPUSFORGE_CORS_ALLOWED_ORIGINS:http://localhost:17170,http://127.0.0.1:17170}

# Feature switches
campusforge.features.ai-battles.enabled=${BATTLE_AI_BATTLES_ENABLED:false}