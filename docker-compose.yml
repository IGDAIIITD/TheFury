name: campusforge

# Campus Forge full stack: Postgres + backend + PWA + one-shot demo seeder.
#   docker compose up -d          -> builds images, starts stack, seeds demo data
#   docker compose down           -> stops (volume persists)
#   docker compose down -v        -> stop + wipe the DB volume
#
# Secrets are passed through env vars with sane defaults for local dev.
# Set POSTGRES_PASSWORD / JWT_SECRET / QR_SIGNING_SECRET for any real deploy.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campusforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusforge"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/campusforge
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-9a4f2c8d3b7a1e6f5c8b9a2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:-7c1e9d4a2f6b8c3d5e7a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e}
    ports:
      - "17172:17172"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/17172'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "17170:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  seed:
    image: postgres:17-alpine
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SEED_DB_HOST: db
      SEED_DB_USER: postgres
      SEED_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SEED_DB_NAME: campusforge
    volumes:
      - ./docker/seeds:/seeds:ro
      - ./setup:/setup:ro
    entrypoint: ["/bin/sh", "/seeds/run-seeds.sh"]
    restart: "no"

volumes:
  pgdata:
