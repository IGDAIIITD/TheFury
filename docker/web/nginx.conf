server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # REST API -> backend container
    location /api/ {
        proxy_pass http://backend:17172;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spring CORS only allows specific origins; the app is served same-host
        # so the browser Origin is redundant. Strip it like serve.mjs does.
        proxy_set_header Origin "";
    }

    # Card art -> backend (served from card-art/ on disk)
    location /card-art/ {
        proxy_pass http://backend:17172;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin "";
    }

    # WebSocket / STOMP -> backend container
    location /ws/ {
        proxy_pass http://backend:17172;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # PWA static assets + SPA fallback (deep links; offline reload is handled by the SW)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
